name: Build docker image and deploy to Azure App Service
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'infra/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Cache node_modules directly: restoring is much faster than `npm ci`
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build Next.js
        run: npx next build

      # Restores the previous compressed output + manifest, so only new or
      # changed images get recompressed.
      - name: Cache compressed images
        uses: actions/cache@v4
        with:
          path: |
            public-compressed
            public-compressed.manifest.json
          key: public-compressed-${{ hashFiles('public/**', 'copyPublicAndCompressImages.js') }}
          restore-keys: |
            public-compressed-

      - name: Compress images
        run: node copyPublicAndCompressImages.js public public-compressed

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Log in to ACR
        run: |
          ACR_NAME="${REGISTRY_LOGIN_SERVER%%.*}"
          az acr login --name "$ACR_NAME"
        env:
          REGISTRY_LOGIN_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}

      - name: Build and push image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
        env:
          IMAGE: ${{ secrets.REGISTRY_LOGIN_SERVER }}/ag-web-container:latest

      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --name ${{ secrets.WEBAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }}
