backend:
  name: github
  branch: master
  repo: aaltogamers/AG_web
  #base_url: http://localhost:3000
  base_url: https://aaltogamers.fi
  auth_endpoint: /api/auth
  squash_merges: true
publish_mode: simple
media_folder: public/images
public_folder: /images
local_backend: true
collections:
  - name: 'pages'
    label: 'Pages'
    files:
      - label: 'Partners'
        name: 'partners'
        file: 'src/content/partners.md'
        fields:
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'Body', name: 'body', widget: 'markdown' }
      - label: 'About'
        name: 'about'
        file: 'src/content/about.md'
        fields:
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'Body', name: 'body', widget: 'markdown' }
      - label: 'Safer Space Policy'
        name: 'safespace'
        file: 'src/content/safespace.md'
        fields:
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'Harassment contact people names', name: 'contactPeopleNames', widget: 'list' }
          - { label: 'Body', name: 'body', widget: 'markdown' }
      - label: 'Image Showcase'
        name: 'imageshowcase'
        file: 'src/content/imageShowCase.md'
        fields:
          - label: 'Images'
            name: 'images'
            label_singular: 'Images'
            widget: 'list'
            allow_add: true
            fields:
              - { label: 'Image', name: 'image', widget: 'image' }
      - label: 'Leaderboard'
        name: 'leaderboard'
        file: 'src/content/leaderboard.md'
        fields:
          - label: 'Leaderboard entries'
            name: 'learderboard_entries'
            label_singular: 'Leaderboard entry'
            widget: 'list'
            allow_add: true
            summary: '{{fields.name}}'
            fields:
              - { label: 'Name', name: 'name', widget: 'string' }
              - { label: 'Discord User ID', name: 'discord_user_id', widget: 'string' }
              - label: 'Point entries'
                name: 'point_entries'
                label_singular: 'Point entry'
                widget: 'list'
                allow_add: true
                summary: '{{fields.points_acquired_on}} - {{fields.points}}'
                fields:
                  - { label: Points, name: points, widget: number, required: true }
                  - {
                      label: Point acquired on,
                      name: points_acquired_on,
                      widget: datetime,
                      format: 'DD.MM.YYYY',
                      date_format: 'DD.MM.YYYY',
                      time_format: false,
                      required: true,
                    }
  - label: 'Partner'
    name: 'partner'
    folder: 'src/content/partners'
    create: true
    identifier_field: name
    fields:
      - { label: 'Name', name: 'name', widget: 'string' }
      - { label: 'Image', name: 'image', widget: 'image' }
      - { label: 'Finnish Link', name: 'finnishLink', widget: 'string', required: false }
      - { label: 'English Link', name: 'englishLink', widget: 'string', required: false }
      #- { label: 'Body', name: 'body', widget: 'markdown', required: false }
  - label: 'Event'
    name: 'event'
    folder: 'src/content/events'
    create: true
    identifier_field: name
    sortable_fields: [{ field: 'sessions.0.start', label: 'Time', default_sort: desc }, 'name']
    fields:
      - { label: 'Name', name: 'name', widget: 'string' }
      - label: 'Times and places'
        name: 'sessions'
        widget: 'list'
        summary: "{{fields.start | date('DD/MM/YYYY HH:mm')}} {{fields.name}} @ {{fields.location}}"
        hint: 'One entry per day or part of the event, e.g. Qualifiers and Finals. Leave empty if the time is not known yet.'
        required: false
        collapsed: true
        fields:
          - {
              label: 'Name',
              name: 'name',
              widget: 'string',
              required: false,
              hint: 'Optional, e.g. "Qualifiers" or "Finals"',
            }
          - {
              label: 'Start',
              name: 'start',
              widget: 'datetime',
              format: 'YYYY-MM-DDTHH:mm:ss',
              date_format: 'DD/MM/YYYY',
              required: true,
            }
          - {
              label: 'End',
              name: 'end',
              widget: 'datetime',
              format: 'YYYY-MM-DDTHH:mm:ss',
              date_format: 'DD/MM/YYYY',
              required: true,
            }
          - { label: 'Location', name: 'location', widget: 'string', required: true }
          # Filled with a random id on save (see preSave in index.html); sign-ups are tied to it
          - { label: 'ID', name: 'id', widget: 'hidden', required: false }
      - label: 'Sign-up'
        name: 'signupMode'
        widget: 'select'
        default: 'none'
        hint: 'The sign-up form itself is created in the admin panel (Admin → Signups). Changing this after sign-ups have opened starts new, empty sign-up lists.'
        options:
          - { label: 'No sign-up', value: 'none' }
          - { label: 'One sign-up for the whole event', value: 'event' }
          - { label: 'Separate sign-up for each time & place', value: 'session' }
      - {
          label: 'Image',
          name: 'image',
          widget: 'image',
          required: false,
          hint: 'If left empty, the AG logo is shown',
        }
      - {
          label: 'Visible on calendar',
          name: 'visibleOnCalendar',
          widget: 'boolean',
          default: true,
        }
      - {
          label: 'Visible on events page',
          name: 'visibleOnEventsPage',
          widget: 'boolean',
          default: true,
        }
      - {
          label: 'Short Description',
          name: 'description',
          widget: 'markdown',
          hint: 'This will be shown in the event list',
        }
      - {
          label: 'Long Description',
          name: 'body',
          widget: 'markdown',
          required: false,
          hint: 'This will be shown on the event page, below the times and places. If left empty, the short description is shown there instead.',
        }
      - label: 'Recordings (e.g. Youtube link)'
        name: 'recordings'
        widget: 'list'
        required: false
        default: []
        summary: '{{fields.name}}'
        fields:
          - { label: 'Name', name: 'name', widget: 'string', required: true, default: 'Recording' }
          - { label: 'URL', name: 'url', widget: 'string', required: true }
  - label: 'Landing info'
    name: 'landinginfo'
    folder: 'src/content/landinginfos'
    create: true
    identifier_field: Title
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Subtitle', name: 'subtitle', widget: 'string' }
      - { label: 'Image', name: 'image', widget: 'image' }
      - { label: 'Body', name: 'body', widget: 'markdown' }
  - label: 'History'
    name: 'history'
    folder: 'src/content/history'
    create: true
    identifier_field: year
    sortable_fields: ['year']
    fields:
      - { label: 'Year', name: 'year', widget: 'string' }
      - { label: 'Title', name: 'title', widget: 'string', required: false }
      - label: 'Board Members'
        name: 'boardMembers'
        label_singular: 'Board Member'
        widget: 'list'
        allow_add: true
        summary: '{{fields.name}}'
        fields:
          - { label: 'Name', name: 'name', widget: 'string' }
          - { label: 'Title', name: 'title', widget: 'string', required: false }
          - { label: 'Image', name: 'image', widget: 'image', required: false }
          - { label: 'Status', name: 'status', widget: 'string', required: false }
          - { label: 'Game', name: 'game', widget: 'string', required: false }
      - { label: 'Body', name: 'body', widget: 'markdown', required: false }
  - label: 'Redirect Links'
    name: 'links'
    files:
      - label: 'Redirect links'
        name: 'links'
        file: 'public/redirects.md'
        fields:
          - label: 'Redirect links'
            label_singular: 'Redirect link'
            name: 'redirects'
            widget: 'list'
            allow_add: true
            fields:
              - { label: 'Name', name: 'name', widget: 'string', placeholder: 'AG Twitch' }
              - {
                  label: 'Path',
                  name: 'slug',
                  widget: 'string',
                  hint: 'The end of the url on the AG website, e.g. aaltogamers.fi/link/*this*',
                }
              - { label: 'URL', name: 'url', widget: 'string' }
